<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PINK CHAMBER 11</title>
<style>
:root{--pk:#ff4fa3;--pk2:#ff9fd0;--bg:#12020c;--pl:#2a0a22}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#ffd9ec;font-family:'Courier New',monospace;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0}
#zone{position:fixed;left:0;bottom:0;width:55%;height:230px}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,79,163,.6);background:rgba(255,79,163,.1);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,159,208,.75);box-shadow:0 0 14px var(--pk)}
.b{position:fixed;border-radius:50%;border:2px solid var(--pk);background:rgba(42,10,34,.72);color:var(--pk2);font:bold 12px 'Courier New',monospace;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 12px rgba(255,79,163,.5);touch-action:none}
.b.on{background:var(--pk);color:#200;}
.b:active{background:var(--pk);color:#200}
#bAct{right:calc(16px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:78px;height:78px;font-size:15px}
#bKick{right:104px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px}
#bSneak{right:16px;bottom:calc(128px + env(safe-area-inset-bottom));width:60px;height:60px}
#bClue{right:92px;bottom:calc(100px + env(safe-area-inset-bottom));width:52px;height:52px}
.ov{position:fixed;inset:0;background:rgba(14,0,10,.9);display:none;align-items:center;justify-content:center;padding:14px;z-index:5;overflow:auto}
.pn{width:100%;max-width:420px;border:2px solid var(--pk);border-radius:14px;background:linear-gradient(160deg,#2f0b27,#14030f);padding:18px;box-shadow:0 0 30px rgba(255,79,163,.45),inset 0 0 20px rgba(0,0,0,.6)}
h1{font:36px Impact,'Arial Black',sans-serif;letter-spacing:3px;color:var(--pk);text-shadow:0 0 12px var(--pk),0 0 28px #c0267a;text-align:center;line-height:1}
h2{font:20px Impact,'Arial Black',sans-serif;letter-spacing:2px;color:var(--pk);text-shadow:0 0 8px var(--pk)}
.sub{font-size:11px;letter-spacing:3px;color:var(--pk2);text-align:center;margin:6px 0 12px}
.tx{font-size:13px;line-height:1.5;margin:10px 0}
.hl{color:#ffe38a}
button.m{display:block;width:100%;margin-top:10px;padding:13px;font:bold 15px 'Courier New',monospace;letter-spacing:2px;background:var(--pk);color:#26000f;border:0;border-radius:8px;box-shadow:0 0 14px var(--pk)}
button.m.alt{background:transparent;color:var(--pk2);border:1px solid var(--pk);box-shadow:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tools button{flex:1 1 auto;padding:9px 6px;font:bold 12px 'Courier New',monospace;background:#1c0716;color:var(--pk2);border:1px solid var(--pk);border-radius:6px}
.tools .ln{flex:1 1 auto;text-align:center}
.ln{padding:9px 10px;font:bold 12px 'Courier New',monospace;background:var(--pk);color:#26000f;border:1px solid var(--pk);border-radius:6px;text-decoration:none;box-shadow:0 0 10px var(--pk)}
.tools button:active{background:var(--pk);color:#200}
.scr{background:#0b0208;border:1px solid #6b2150;border-radius:6px;padding:10px;font-size:14px;color:#7dffb0;word-break:break-all;min-height:48px;line-height:1.4}
#ans{width:100%;margin-top:8px;padding:12px;background:#0b0208;border:1px solid var(--pk);border-radius:6px;color:#fff;font:16px 'Courier New',monospace;text-transform:uppercase;-webkit-user-select:text;user-select:text}
#pzmsg{min-height:18px;font-size:12px;margin-top:6px;color:#ffe38a}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="zone"></div><div id="stick"><div id="knob"></div></div>
<div class="b" id="bAct">ACT</div><div class="b" id="bKick">KICK</div><div class="b" id="bSneak">SNEAK</div><div class="b" id="bClue">CLUE</div>

<div class="ov" id="ov"><div class="pn" id="pn"></div></div>
<div class="ov" id="pz"><div class="pn" id="pzp">
 <h2 id="pzt"></h2>
 <div class="tx" id="pzs"></div>
 <div class="sub" style="text-align:left;margin:4px 0">INTERCEPT</div>
 <div class="scr" id="pzw" style="white-space:pre-wrap"></div><div id="pzq"></div>
 <div class="sub" id="pztool" style="text-align:left;margin:10px 0 0;color:#ffe38a"></div>
 <div class="tools" id="pztools"></div>
 <input id="ans" placeholder="TYPE DECODED MESSAGE" autocomplete="off" autocapitalize="characters" spellcheck="false">
 <div id="pzmsg"></div>
 <button class="m" id="pzok">SUBMIT</button>
 <button class="m alt" id="pzhint">HINT</button>
 <button class="m alt" id="pzx">BACK TO FIELD</button>
</div></div>

const a85=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=4){const n=Math.min(4,b.length-i);let v=0;for(let j=0;j<4;j++)v=v*256+(j<n?b[i+j]:0);const c=[];for(let j=0;j<5;j++){c.unshift(String.fromCharCode(v%85+33));v=Math.floor(v/85)}o+=c.slice(0,n+1).join('')}return o};

 g:R.g.map((p,i)=>({p,i:1,x:p[0][0],y:p[0][1],fx:1,fy:0,w:0,st:0,sp:52+n*7+i*3}))};
 $('bSneak').classList.remove('on');pz=R.intercept(R.plain)}
/* ---------- overlays ---------- */
function show(html){running=false;$('pn').innerHTML=html;$('ov').style.display='flex'}
function hide(){$('ov').style.display='none';running=true;last=performance.now()}
function title(){show(`<h1>PINK<br>CHAMBER 11</h1><div class="sub">A RACHEL VANCE ESPIONAGE FILE</div>
<div class="tx">German arms dealer <span class="hl">Baron Konrad von Eisenfeld</span> is selling a weapon called CHIMERA. Rachel works alone. Sneak past guards and collect each clue. Every clue can only be cracked with <a style="color:#ffe38a" href="${OMNI}" target="_blank" rel="noopener">TeamLegacy OmniTool ↗</a>. Follow the trail across Europe and take him down.</div>
<div class="tx" style="font-size:11px;color:#c98ab0">Decode clues at OmniTool (opens in a new tab). Left thumb: move (push far to run) · ACT: inspect · KICK: stun a guard · SNEAK: stay quiet and small. Keyboard: WASD/arrows, E, Space, C.</div>
<button class="m" onclick="start(0)">START OPERATION</button>${best>0&&best<6?`<button class="m alt" onclick="start(${best})">CONTINUE · MISSION ${best+1}</button>`:''}
<button class="m alt" id="snb" onclick="snd=!snd;this.textContent=snd?'SOUND: ON':'SOUND: OFF'">SOUND: ON</button>`)}
function start(n,prev){const Gc=G;if(n==0)G=null;load(n);const R=M[n];
 show(`<div class="sub" style="margin:0">${R.s}</div><h2 style="text-align:center">${R.t}</h2>${prev?`<div class="tx" style="color:#7dffb0">▸ ${prev}</div>`:''}<div class="tx">${R.brief}</div><div class="tx" style="font-size:11px;color:#c98ab0">Find the briefcase, decode the clue, then reach the exit.</div><button class="m" onclick="hide()">GO</button>`);
 try{if(n>best){best=n;localStorage.setItem('pc11',n)}}catch(e){}}
function win(){try{localStorage.setItem('pc11',0)}catch(e){}best=0;jingle();show(`<h1>CASE<br>CLOSED</h1><div class="sub">BARON EISENFELD IS IN CUSTODY</div><div class="tx">${M[5].reveal}</div><div class="tx">Every clue was cracked with <a style="color:#ffe38a" href="${OMNI}" target="_blank" rel="noopener">OmniTool ↗</a>. Times caught: <span class="hl">${G.caught}</span>. Well done, agent.</div><button class="m" onclick="start(0)">PLAY AGAIN</button>`)}
/* ---------- puzzle ---------- */
function pzMsg(m){$('pzmsg').textContent=m}
function copyTxt(t){const done=()=>pzMsg('Copied. Now paste it into OmniTool.');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb();function fb(){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){pzMsg('Copy failed. Select the text and copy it manually.')}a.remove()}}
function openPz(){const R=G.R;running=false;$('pzt').textContent=R.t;$('pzs').innerHTML=R.brief;
 $('pzw').textContent=pz.show;$('pzq').innerHTML=pz.qr?`<img src="${pz.qr}" alt="QR security plate" style="width:200px;height:200px;image-rendering:pixelated;display:block;margin:10px auto;border-radius:6px"><a class="ln" style="display:block;text-align:center" download="security-plate.png" href="${pz.qr}">⬇ SAVE QR IMAGE</a>`:'';
 $('pztool').textContent='DECODE WITH: '+R.tool;
 const tb=$('pztools');tb.innerHTML='';
 if(pz.copy){const b=document.createElement('button');b.textContent='COPY INTERCEPT';b.onclick=()=>{copyTxt(pz.copy);beep(700,.05)};tb.appendChild(b)}
 const a=document.createElement('a');a.className='ln';a.href=OMNI;a.target='_blank';a.rel='noopener';a.textContent='OPEN OMNITOOL ↗';tb.appendChild(a);
 pzMsg(G.solved?'Already decoded. Head for the exit.':'');$('pz').style.display='flex'}
function closePz(){$('pz').style.display='none';$('ans').blur();running=true;last=performance.now()}
$('pzx').onclick=closePz;
$('pzhint').onclick=()=>pzMsg('HINT: '+G.R.hint);
$('pzok').onclick=()=>{const n=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(n($('ans').value)===n(G.R.plain)){G.solved=true;jingle();toast='DECODED · EXIT UNLOCKED';toastT=4;$('ans').value='';closePz()}
 else{beep(160,.25,'sawtooth');pzMsg('ACCESS DENIED. Decode it with OmniTool and try again.');const p=$('pzp');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}};
/* ---------- input ---------- */
const zone=$('zone'),stick=$('stick'),knob=$('knob');let jid=null,jo=null;
zone.addEventListener('pointerdown',e=>{jid=e.pointerId;zone.setPointerCapture(jid);jo={x:e.clientX,y:e.clientY};stick.style.cssText+=`display:block;left:${jo.x}px;top:${jo.y}px`;});
zone.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;let dx=e.clientX-jo.x,dy=e.clientY-jo.y;const d=Math.hypot(dx,dy),m=55;if(d>m){dx*=m/d;dy*=m/d}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`});
const endJ=e=>{if(e.pointerId!==jid)return;jid=null;joy.x=joy.y=0;stick.style.display='none';knob.style.transform=''};
zone.addEventListener('pointerup',endJ);zone.addEventListener('pointercancel',endJ);
const tap=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();f()});
tap('bAct',act);tap('bKick',kick);tap('bSneak',sneak);tap('bClue',()=>{if(running&&G.found)openPz()});
function sneak(){if(!running)return;G.sneak=!G.sneak;$('bSneak').classList.toggle('on',G.sneak);beep(300,.05)}
function kick(){if(!running||G.kcd>0)return;G.atk=.35;G.kcd=.8;beep(220,.08,'sawtooth');
 G.g.forEach(g=>{const dx=g.x-G.x,dy=g.y-(G.y-10);if(dx*G.face>-8&&Math.abs(dx)<58&&Math.abs(dy)<34&&!g.st){g.st=3.2;beep(90,.2,'triangle',.12);toast='GUARD STUNNED';toastT=1.2}})}
function act(){if(!running)return;const R=G.R,d=Math.hypot(G.x-R.item[0],G.y-R.item[1]);
 if(d<46){if(!G.found){G.found=true;beep(880,.1);toast='CLUE SECURED'}openPz()}}
addEventListener('keydown',e=>{if($('pz').style.display==='flex')return;keys[e.key.toLowerCase()]=1;const k=e.key.toLowerCase();if(k==='e')act();if(k===' ')kick();if(k==='c')sneak()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
/* ---------- logic ---------- */
const blocked=(x,y,w)=>w.some(r=>x+7>r[0]&&x-7<r[0]+r[2]&&y>r[1]&&y-8<r[1]+r[3]);
const inWall=(x,y,w)=>w.some(r=>x>r[0]&&x<r[0]+r[2]&&y>r[1]&&y<r[1]+r[3]);
function update(dt){const R=G.R;G.t+=dt;G.kcd-=dt;G.atk=Math.max(0,G.atk-dt);toastT-=dt;
 if(G.hit>0){G.hit-=dt;if(G.hit<=0){G.x=R.start[0];G.y=R.start[1];G.alert=0}return}
 let ix=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 let m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;m=1}
 G.moving=m>.12;G.run=m>.85&&!G.sneak;
 if(G.moving){const sp=G.sneak?38:G.run?118:72;const nx=G.x+ix*sp*dt,ny=G.y+iy*sp*dt;
  if(!blocked(nx,G.y,R.walls))G.x=Math.max(14,Math.min(W-14,nx));if(!blocked(G.x,ny,R.walls))G.y=Math.max(52,Math.min(H-6,ny));if(Math.abs(ix)>.1)G.face=ix>0?1:-1;
  G.step=(G.step||0)+dt;if(G.step>(G.run?.2:.34)&&!G.sneak){G.step=0;beep(70+Math.random()*30,.04,'triangle',.04)}}
 let seen=false;
 G.g.forEach(g=>{if(g.st>0){g.st-=dt;return}
  if(g.w>0){g.w-=dt}else{const t=g.p[g.i],dx=t[0]-g.x,dy=t[1]-g.y,d=Math.hypot(dx,dy);if(d<3){g.i=1-g.i;g.w=.7}else{g.fx=dx/d;g.fy=dy/d;g.x+=g.fx*g.sp*dt;g.y+=g.fy*g.sp*dt}}
  const rg=(G.sneak?62:G.run?150:112),dx=G.x-g.x,dy=G.y-12-g.y,d=Math.hypot(dx,dy);
  if(d<20)seen=true;else if(d<rg&&(dx*g.fx+dy*g.fy)/d>Math.cos(.66)){let ok=1;for(let t=.1;t<1;t+=.1)if(inWall(g.x+dx*t,g.y+dy*t,R.walls)){ok=0;break}if(ok)seen=true}});
 G.alert=Math.max(0,Math.min(1,G.alert+(seen?1.5:-.6)*dt));
 if(G.alert>=1){G.hit=.95;G.caught++;beep(120,.5,'sawtooth',.1);toast='SPOTTED!';toastT=1.4}
 if(G.hit<=0&&G.alert>.05&&!seen&&Math.random()<.02)beep(300,.03,'sine',.02);
 const dd=Math.hypot(G.x-R.door[0],G.y-R.door[1]);
 if(dd<28){if(G.solved){const n=G.n+1;if(n>5)win();else start(n,R.reveal)}else if(toastT<=0){toast='EXIT LOCKED · DECODE THE CLUE';toastT=2}}}
/* ---------- render ---------- */
function sprite(a,x,y,s){const [r,n,fps]=ROW[a];let f=Math.floor(G.t*fps)%n;
 if(a==='attack')f=Math.min(n-1,Math.floor((.35-G.atk)/.35*n));if(a==='hit')f=Math.min(n-1,Math.floor((.95-G.hit)/.95*n));
 cx.save();cx.translate(x,y);cx.scale(G.face*s,s);cx.drawImage(atlas,f*84,r*84,84,84,-42,-82,84,84);cx.restore()}
function guard(g){cx.save();cx.translate(g.x,g.y);
 if(!g.st){const a=Math.atan2(g.fy,g.fx),rg=112,al=G.alert;const gr=cx.createRadialGradient(0,-12,4,0,-12,rg);gr.addColorStop(0,`rgba(255,${60+al*0},${90},${.38+al*.3})`);gr.addColorStop(1,'rgba(255,60,120,0)');
  cx.fillStyle=gr;cx.beginPath();cx.moveTo(0,-12);cx.arc(0,-12,rg,a-.66,a+.66);cx.closePath();cx.fill()}
 cx.fillStyle='rgba(0,0,0,.4)';cx.beginPath();cx.ellipse(0,0,13,5,0,0,7);cx.fill();
 cx.fillStyle=g.st?'#4a5a8a':'#2b2a3a';cx.fillRect(-8,-24,16,24);cx.fillStyle='#c0267a';cx.fillRect(-8,-15,16,4);
 cx.fillStyle='#e9c7a8';cx.beginPath();cx.arc(0,-30,7,0,7);cx.fill();cx.fillStyle=g.st?'#334':'#16151f';cx.fillRect(-8,-38,16,6);cx.fillRect(-9,-33,18,3);
 if(g.st){cx.fillStyle='#ffe38a';cx.font='12px monospace';cx.textAlign='center';cx.fillText('✦ ✦',0,-44)}cx.restore()}
function render(){const w=innerWidth,h=innerHeight,R=G.R;cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,w,h);
 cx.fillStyle='#12020c';cx.fillRect(0,0,w,h);
 /* HUD */
 cx.fillStyle='#ff4fa3';cx.font='bold 12px Courier New';cx.textAlign='left';cx.fillText(R.t,10,18);
 cx.fillStyle='#ff9fd0';cx.font='11px Courier New';cx.fillText(!G.found?'◆ FIND THE BRIEFCASE':!G.solved?'◆ DECODE THE CLUE (CLUE BUTTON)':'▲ REACH THE EXIT',10,35);
 cx.textAlign='right';cx.fillStyle='#ff9fd0';cx.fillText('OP '+(G.n+1)+'/6',w-10,35);
 cx.strokeStyle='#ff4fa3';cx.strokeRect(w-110.5,8.5,100,9);cx.fillStyle=G.alert>.6?'#ff2a5a':'#ff9fd0';cx.fillRect(w-109,10,98*G.alert,6);
 cx.setTransform(DPR*K,0,0,DPR*K,DPR*OX,DPR*OY);
 cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.clip();
 const fl=cx.createLinearGradient(0,0,0,H);fl.addColorStop(0,'#2a0a22');fl.addColorStop(1,'#180616');cx.fillStyle=fl;cx.fillRect(0,0,W,H);
 cx.strokeStyle='rgba(255,120,190,.07)';cx.lineWidth=1;for(let i=0;i<=W;i+=40){cx.beginPath();cx.moveTo(i,0);cx.lineTo(i,H);cx.stroke()}for(let i=0;i<=H;i+=40){cx.beginPath();cx.moveTo(0,i);cx.lineTo(W,i);cx.stroke()}
 cx.fillStyle='rgba(255,120,190,.06)';cx.font='bold 26px Impact,sans-serif';cx.textAlign='center';cx.fillText(R.s.split('·')[1].trim(),W/2,H-8);
 R.walls.forEach(r=>{cx.fillStyle='#431038';cx.fillRect(r[0],r[1],r[2],r[3]);cx.fillStyle='#ff4fa3';cx.fillRect(r[0],r[1],r[2],2);cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(r[0],r[1]+r[3],r[2],5)});
 /* door */
 const d=R.door,op=G.solved,p=.5+.5*Math.sin(G.t*4);cx.fillStyle=op?`rgba(125,255,176,${.4+.3*p})`:'rgba(255,42,90,.35)';cx.fillRect(d[0]-22,d[1]-14,44,28);cx.strokeStyle=op?'#7dffb0':'#ff2a5a';cx.strokeRect(d[0]-22,d[1]-14,44,28);cx.fillStyle='#fff';cx.font='bold 10px Courier New';cx.fillText(op?'EXIT ▲':'LOCKED',d[0],d[1]+4);
 /* item */
 const it=R.item;cx.save();cx.translate(it[0],it[1]);if(!G.found){cx.shadowColor='#ffe38a';cx.shadowBlur=10+8*p}cx.fillStyle=G.found?'#6b5a4a':'#e8a63a';cx.fillRect(-12,-16,24,16);cx.fillStyle='#5a3410';cx.fillRect(-4,-19,8,4);cx.fillRect(-1,-9,2,4);cx.restore();
 if(Math.hypot(G.x-it[0],G.y-it[1])<46&&!G.found){cx.fillStyle='#ffe38a';cx.font='bold 11px Courier New';cx.fillText('TAP ACT',it[0],it[1]-26)}
 /* actors by y */
 const act=[{y:G.y,f:()=>{cx.fillStyle='rgba(0,0,0,.4)';cx.beginPath();cx.ellipse(G.x,G.y,15,5,0,0,7);cx.fill();
   const a=G.hit>0?'hit':G.atk>0?'attack':G.sneak?'crouch':G.moving?(G.run?'run':'walk'):'idle';
   let s=.78;
   const sx=G.x;sprite2(a,sx,G.y,s)}},...G.g.map(g=>({y:g.y,f:()=>guard(g)}))].sort((a,b)=>a.y-b.y);
 act.forEach(o=>o.f());
 if(toastT>0){cx.fillStyle='rgba(20,0,14,.85)';cx.fillRect(40,H/2-20,W-80,34);cx.strokeStyle='#ff4fa3';cx.strokeRect(40,H/2-20,W-80,34);cx.fillStyle='#ffe38a';cx.font='bold 13px Courier New';cx.fillText(toast,W/2,H/2+2)}
 if(G.hit>0){cx.fillStyle='rgba(255,40,90,.25)';cx.fillRect(0,0,W,H)}cx.restore()}
function sprite2(a,x,y,s){cx.save();cx.translate(x,y);sprite(a,0,0,s);cx.restore()}
function loop(t){requestAnimationFrame(loop);if(!G)return;const dt=Math.min(.05,(t-last)/1000||0);last=t;if(running)update(dt);render()}
load(0);title();requestAnimationFrame(loop);
</script></body></html>
